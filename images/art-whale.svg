<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Watercolour whale">
  <defs>
    <filter id="w-wcf" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="w-wcf2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="w-soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="w-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer></filter>
  </defs>

  <g filter="url(#w-soft)" opacity=".45">
    <ellipse cx="150" cy="176" rx="112" ry="80" fill="#bcd3e0"/>
    <ellipse cx="150" cy="228" rx="120" ry="34" fill="#9dc0d4"/>
  </g>

  <!-- spout -->
  <g filter="url(#w-wcf2)" opacity=".85">
    <path d="M118 96c-4-18 4-32 16-34 4 12 0 24-16 34Z" fill="#cfe4ef"/>
    <path d="M126 92c6-16 18-24 30-20-4 12-16 20-30 20Z" fill="#e3f0f6"/>
    <circle cx="112" cy="70" r="5" fill="#cfe4ef"/>
    <circle cx="146" cy="62" r="4" fill="#cfe4ef"/>
  </g>

  <!-- tail -->
  <g filter="url(#w-wcf)">
    <path d="M226 154c18-16 38-20 48-10-8 12-8 26 0 40-14 8-34-4-48-30Z" fill="#7fa8c4" opacity=".9"/>
  </g>

  <!-- body -->
  <g filter="url(#w-wcf)">
    <path d="M60 168c0-34 34-58 82-58 44 0 84 20 92 46-12 26-48 44-92 44-48 0-82-20-82-32Z" fill="#8fb0c4" opacity=".92"/>
    <path d="M70 186c14 12 44 22 76 22 26 0 50-6 68-16-16 16-42 26-70 26-32 0-58-12-74-32Z" fill="#e7f1f6" opacity=".9"/>
  </g>

  <!-- fin -->
  <g filter="url(#w-wcf2)">
    <path d="M140 176c14-4 26 2 30 14-14 6-26 0-30-14Z" fill="#6f97b0" opacity=".9"/>
  </g>

  <!-- face -->
  <circle cx="96" cy="150" r="5.4" fill="#4f453a"/>
  <circle cx="97.6" cy="148" r="1.9" fill="#fff"/>
  <path d="M84 166c6 5 14 5 20 0" stroke="#4f453a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <ellipse cx="80" cy="160" rx="8" ry="5.4" fill="#e0857f" opacity=".42"/>

  <!-- bubbles -->
  <g fill="#dcecf4" opacity=".9">
    <circle cx="46" cy="120" r="7"/><circle cx="34" cy="146" r="4.6"/><circle cx="52" cy="96" r="4"/>
  </g>

  <!-- little wave line -->
  <path d="M20 244c22-12 44 12 66 0s44 12 66 0 44 12 66 0 44 12 62 0" stroke="#7fa8c4" stroke-width="4" fill="none" stroke-linecap="round" opacity=".65"/>

  <rect width="300" height="300" filter="url(#w-grain)" opacity=".5"/>
</svg>
