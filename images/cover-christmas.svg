<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Christmas watercolour cover">
  <defs>
    <filter id="c1" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="c2" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="cs"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="cg"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="g"/><feColorMatrix in="g" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer></filter>
  </defs>
  <rect width="400" height="300" fill="#eef3ee"/>
  <g filter="url(#cs)" opacity=".55">
    <ellipse cx="200" cy="150" rx="150" ry="120" fill="#dce7e2"/>
    <ellipse cx="200" cy="250" rx="200" ry="60" fill="#cfe0d6"/>
    <circle cx="330" cy="70" r="40" fill="#f6ddc0"/>
  </g>
  <!-- snow ground -->
  <path d="M0 230c60-16 120-10 200 2s140 6 200-8v76H0Z" fill="#fbf7f0" filter="url(#c1)"/>
  <!-- trees -->
  <g filter="url(#c1)">
    <path d="M96 232 66 232 81 196Z" fill="#6f9270"/><path d="M92 210 70 210 81 178Z" fill="#7fa47f"/><path d="M88 190 74 190 81 166Z" fill="#8fb08a"/>
    <path d="M330 236 296 236 313 196Z" fill="#6f9270"/><path d="M326 212 300 212 313 176Z" fill="#7fa47f"/>
  </g>
  <!-- gifts -->
  <g filter="url(#c2)">
    <rect x="120" y="204" width="34" height="30" rx="3" fill="#d98468"/><path d="M137 204v30M120 216h34" stroke="#f3d9c6" stroke-width="3"/>
    <rect x="150" y="210" width="26" height="24" rx="3" fill="#8fb0c4"/><path d="M163 210v24M150 220h26" stroke="#e4eef3" stroke-width="3"/>
  </g>
  <!-- big tree center -->
  <g filter="url(#c1)">
    <path d="M210 236 150 236 180 176Z" fill="#5f8a63"/>
    <path d="M204 202 156 202 180 150Z" fill="#6f9a6f"/>
    <path d="M198 172 162 172 180 128Z" fill="#83ab7f"/>
    <rect x="174" y="234" width="12" height="16" fill="#a9836a"/>
    <path d="M180 120l3 8 8 1-6 6 2 8-7-4-7 4 2-8-6-6 8-1z" fill="#ddab5e"/>
  </g>
  <g fill="#d98468"><circle cx="168" cy="196" r="4"/><circle cx="192" cy="184" r="4"/><circle cx="176" cy="166" r="4"/></g>
  <g fill="#e4b24f"><circle cx="190" cy="210" r="4"/><circle cx="170" cy="220" r="4"/></g>
  <!-- snowman -->
  <g filter="url(#c2)">
    <circle cx="300" cy="224" r="20" fill="#fdfaf3" stroke="#e2ddd2" stroke-width="2"/>
    <circle cx="300" cy="192" r="14" fill="#fdfaf3" stroke="#e2ddd2" stroke-width="2"/>
    <path d="M300 192l10 2-10 3Z" fill="#e0873f"/>
    <circle cx="296" cy="189" r="1.6" fill="#4f453a"/><circle cx="304" cy="189" r="1.6" fill="#4f453a"/>
    <path d="M286 180h28l-3 8h-22Z" fill="#c0563f"/><rect x="292" y="172" width="16" height="10" fill="#c0563f"/>
  </g>
  <!-- snowflakes -->
  <g stroke="#bcd3cb" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <g transform="translate(60,70)"><path d="M0-10V10M-10 0H10M-7-7 7 7M-7 7 7-7"/></g>
    <g transform="translate(360,150)"><path d="M0-8V8M-8 0H8M-6-6 6 6M-6 6 6-6"/></g>
  </g>
  <rect width="400" height="300" filter="url(#cg)" opacity=".5"/>
</svg>
