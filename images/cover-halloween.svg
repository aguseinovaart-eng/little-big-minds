<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Halloween watercolour cover">
  <defs>
    <filter id="h1" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="h2" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="hs"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="hg"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="g"/><feColorMatrix in="g" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer></filter>
  </defs>
  <rect width="400" height="300" fill="#f6ece0"/>
  <g filter="url(#hs)" opacity=".5">
    <ellipse cx="200" cy="150" rx="150" ry="120" fill="#f0d7b8"/>
    <ellipse cx="200" cy="250" rx="200" ry="60" fill="#dcc9a8"/>
    <circle cx="320" cy="66" r="34" fill="#f4e3b0"/>
  </g>
  <!-- moon -->
  <circle cx="320" cy="66" r="26" fill="#f7edc4" filter="url(#h2)"/>
  <!-- ground -->
  <path d="M0 236c60-14 120-8 200 2s140 4 200-10v72H0Z" fill="#c9a06a" opacity=".55" filter="url(#h1)"/>
  <!-- bats -->
  <g fill="#6b5570" filter="url(#h2)">
    <path d="M70 70c6-6 12-6 16 0 4-6 10-6 16 0-6 2-10 2-16-2-6 4-10 4-16 2Z"/>
    <path d="M120 50c5-5 10-5 13 0 3-5 8-5 13 0-5 2-8 2-13-1-5 3-8 3-13 1Z"/>
  </g>
  <!-- pumpkin (friendly) -->
  <g filter="url(#h1)">
    <ellipse cx="180" cy="196" rx="62" ry="52" fill="#e08a3f"/>
    <ellipse cx="150" cy="196" rx="26" ry="50" fill="#d97f34" opacity=".7"/>
    <ellipse cx="210" cy="196" rx="26" ry="50" fill="#d97f34" opacity=".7"/>
    <rect x="174" y="140" width="12" height="16" rx="3" fill="#7d9a5e"/>
    <path d="M186 142c8-6 16-4 20 2-8 4-16 2-20-2Z" fill="#8aa663"/>
  </g>
  <!-- face -->
  <g fill="#5a3f2a">
    <path d="M156 184l14-8 14 8Z"/>
    <path d="M196 184l14-8 14 8Z" transform="translate(-4,0)"/>
    <path d="M150 210c14 16 46 16 60 0-6 6-14 8-30 8s-24-2-30-8Z"/>
  </g>
  <g opacity=".4" fill="#c0563f"><ellipse cx="146" cy="204" rx="10" ry="7"/><ellipse cx="214" cy="204" rx="10" ry="7"/></g>
  <!-- small candy -->
  <g filter="url(#h2)"><ellipse cx="292" cy="224" rx="16" ry="10" fill="#e0857f"/><path d="M276 224l-8-6v12ZM308 224l8-6v12Z" fill="#c96b64"/></g>
  <rect width="400" height="300" filter="url(#hg)" opacity=".5"/>
</svg>
