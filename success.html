<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank you! · Little Big Minds</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f7efe1;--card:#fffdf7;--ink:#4f453a;--muted:#93826f;--terra:#d98468;--terra-d:#c06b52;--sage:#8aa683;--line:#e8dac2;--shadow:0 14px 30px rgba(79,69,58,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(rgba(200,170,120,.12) 1.3px, transparent 1.3px);background-size:24px 24px;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    max-width:520px;width:100%;padding:40px 34px;text-align:center}
  .seal{width:88px;height:88px;margin:0 auto 14px}
  h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:30px;margin-bottom:8px}
  p{color:var(--muted);font-size:17px;margin-bottom:8px}
  .btn{display:inline-block;margin-top:18px;font-family:"Nunito";font-weight:800;font-size:16px;
    background:var(--terra);color:#fff;padding:15px 30px;border-radius:16px;border:2px solid var(--terra-d);
    box-shadow:var(--shadow);cursor:pointer;text-decoration:none;transition:transform .15s ease}
  .btn:hover{transform:translate(-1px,-2px)}
  .hand{font-family:"Gochi Hand",cursive;color:var(--sage);font-size:20px}
  .home{display:block;margin-top:22px;color:var(--muted);font-size:14px}
  .err{color:var(--terra-d);font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <svg class="seal" viewBox="0 0 96 96" fill="none">
      <path d="M48 8l6 6 8-3 3 8 8 3-3 8 6 6-6 6 3 8-8 3-3 8-8-3-6 6-6-6-8 3-3-8-8-3 3-8-6-6 6-6-3-8 8-3 3-8 8 3z" fill="#f1e6d2" stroke="#ddab5e" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M34 49l9 9 20-22" stroke="#8aa683" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="hand" data-en="yay! thank you 💛" data-pl="hurra! dziękujemy 💛">yay! thank you 💛</p>
    <h1 data-en="Your bundle is ready!" data-pl="Twój zestaw jest gotowy!">Your bundle is ready!</h1>
    <p data-en="Thanks for your order. Click below to download your printable — you can print it as many times as you like." data-pl="Dziękujemy za zamówienie. Kliknij poniżej, aby pobrać plik do druku — możesz drukować, ile chcesz.">Thanks for your order. Click below to download your printable — you can print it as many times as you like.</p>
    <a id="dl" class="btn" href="#" data-en="⬇ Download my bundle" data-pl="⬇ Pobierz zestaw">⬇ Download my bundle</a>
    <a class="home" href="/" data-en="← Back to Little Big Minds" data-pl="← Wróć do Little Big Minds">← Back to Little Big Minds</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const sid = params.get("session_id");
    const dl = document.getElementById("dl");
    if (sid) {
      dl.href = "/.netlify/functions/download?session_id=" + encodeURIComponent(sid);
    } else {
      dl.setAttribute("data-en", "Order not found");
      dl.setAttribute("data-pl", "Nie znaleziono zamówienia");
      dl.textContent = "Order not found";
      dl.classList.add("err");
      dl.removeAttribute("href");
    }
  </script>
  <script src="i18n.js" defer></script>
</body>
</html>
